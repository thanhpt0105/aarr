[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arrr"
version = "0.1.0"
description = "Standalone media automation: movies, TV, subtitles, indexers, requests"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "defusedxml>=0.7",
]

[project.scripts]
arrr = "arrr.main:run"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arrr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/arrr/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
